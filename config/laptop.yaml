general:
  input_method: video # acceptable inputs: webcam, video, gstreamer
  save_output: True
  track_length: 8 # Short history catches the quick turn at the window in crash2.mp4
  save_tracks: True # Save a separate MP4 for every confirmed track
  show_mask: False
  show_output: True # Whether or not the video feed will be shown
  

paths:
  model_path: 'models/'
  output_path: 'outputs/'
  video_path: 'videos/'

video: crash2.mp4

detector: 
  type: GeometryMethod # Valid detectors: GeometryMethod
  threshold: 45 # Angle for GeometryMethod
  refractory_frames: 40 # How many frames after a detection will the model ignore the track to prevent double events
  override_frames: 100 # How many frames after a detection will the model ignore ALL tracks
  
gstreamer:
  source: 'nvarguscamerasrc'
  file: 'video/x-raw'
  memory: NVMM
  input_width: 1920
  input_height: 1080
  input_format: NV12
  framerate: 30
  flip_method: 2
  output_width: 960
  output_height: 720
  output_format: BGRx
  sink_format: BGR
  sink: appsink

# Tuned on crash2.mp4 (1596x998, 30 FPS); retune for other scenes or resolutions.
# Motion detection and tracking for a stationary camera.
# Areas count foreground pixels; distances and kernel sizes use original-frame pixels.
blob:
  # Smallest blob to keep after mask cleanup. Raise this to reject small specks;
  # lower it to keep smaller or more distant birds.
  min_area: 85

  # Largest blob to keep after mask cleanup. Lower this to reject large moving
  # regions; raise it if nearby birds are being discarded.
  max_area: 4000

  # Width and height of the Gaussian blur applied before motion detection.
  # Use 0 or 1 to disable, or an odd size (3, 5, ...). Larger sizes smooth noise
  # more strongly but can hide small birds.
  blur_size: 3

  # Opening kernel: removes small foreground specks and thin connections.
  # Use 0 or 1 to disable, or an odd size. Larger sizes may erase distant birds.
  open_size: 3

  # Closing kernel: fills small holes and connects nearby foreground pixels.
  # Use 0 or 1 to disable, or an odd size. Larger sizes can merge separate birds.
  close_size: 5

  # Initial frames used to learn the background without reporting tracks.
  # For example, 30 frames is one second of footage at 30 FPS.
  warmup_frames: 30

  # Background model's history length, in frames. With automatic learning,
  # a larger value generally adapts more slowly to changes in the scene.
  history: 600

  # MOG2 background-match threshold (not a brightness difference in pixels).
  # Lower values detect subtler changes but more noise; higher values are less sensitive.
  var_threshold: 15

  # Background learning rate: -1 selects automatic adaptation; 0 freezes updates
  # after initial setup; values from 0 to 1 set the rate explicitly.
  # Higher rates adapt faster and may absorb slow or stationary objects.
  learning_rate: 0.05

  # Maximum matching distance, in pixels, between a new blob center and a track's
  # predicted center. Raise for faster motion; too high can swap nearby track IDs.
  distance_threshold: 175

  # Maximum track persistence score. Matches build the score; missed frames lower it.
  # Higher values let established tracks (and their videos) survive longer gaps.
  # Newer tracks may disappear sooner because their score has not built up yet.
  hit_counter_max: 20

  # A new track's persistence score must exceed this before it is displayed/saved.
  # Higher values reject brief noise but delay recording; 0 confirms immediately.
  # Must be less than hit_counter_max. With no misses, 3 confirms on detection 4.
  initialization_delay: 3
